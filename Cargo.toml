[package]
name = "easyhttpmock-vetis-tokio"
version = "0.1.2-beta.1"
edition = "2021"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/easyhttpmock-vetis-tokio"
homepage = "https://github.com/ararog/easyhttpmock"
description = "EasyHttpMock adapter for Vetis HTTP server using tokio runtime."
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "mock", "testing"]
publish = true
rust-version = "1.75.0"

[package.metadata.docs.rs]
all-features = true

[features]
default = [
  "http2",
  #"http3"
]

xml = ["easyhttpmock/xml"]
json = ["easyhttpmock/json"]
http2 = ["vetis-tokio/http2"]
http3 = ["vetis-tokio/http3"]

rust-tls = ["vetis-tokio/rust-tls"]

[dependencies]
caramelo = { version = "0.1.4" }
#easyhttpmock = { path = "../easyhttpmock/easyhttpmock" }
easyhttpmock = { version = "0.1.5-beta.1" }
http = "1.5.0"
http-body-util = "0.1.5"
rand = { version = "0.10.2", default-features = false }
tokio = { version = "1.53.1", default-features = false }
# vetis-tokio = { path = "../vetis-tokio", features = [
#   "http2",
#   #"http3",
#   "rust-tls",
# ], default-features = false }
vetis-tokio = { version = "0.1.2-beta.1", features = [
  "http2",
  #"http3",
  "rust-tls",
], default-features = false }

[dev-dependencies]
#deboa = { path = "../deboa/deboa" }
deboa = { version = "0.1.5-beta.2" }
# deboa-tokio = { path = "../deboa-tokio/deboa-tokio", default-features = false, features = [
#   "http2",
#   #"http3",
#   "rust-tls",
#   "default-rustls-provider",
#   "default-rustls-verifier",
# ] }
deboa-tokio = { version = "0.1.4-beta.3", default-features = false, features = [
  "http2",
  #"http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
] }
tokio = { version = "1.53.1", default-features = false, features = ["macros"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
